name: CI

on:
  push:
    branches: [production]
  pull_request:
    branches: [production]

jobs:
  check:
    runs-on: ubuntu-latest
    container:
      image: crystallang/crystal:latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: marten_tools_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: shards install

      - name: Check formatting
        run: crystal tool format --check src/ spec/

      - name: Build
        run: crystal build src/marten_tools.cr --no-codegen
